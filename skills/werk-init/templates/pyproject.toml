[project]
name = "{{project_name}}"
version = "0.1.0"
description = "{{tagline}}"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["matplotlib", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{pkg}}"]
